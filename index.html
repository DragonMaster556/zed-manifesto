            <pre>// Main Game Window & Fixed-Timestep Loop Setup\nuse zed::window::{WindowContext, VideoMode};\n\npub fn run_game_loop(window: &mut WindowContext) {\n    let mut accumulator = 0.0;\n    let fixed_dt = 1.0 / 60.0;\n    while window.is_open() {\n        accumulator += window.poll_frame_delta();\n        while accumulator >= fixed_dt {\n            game_logic_update(fixed_dt);\n            accumulator -= fixed_dt;\n        }\n        render_scene_frame();\n    }\n}</pre>`,

            <p>Checking for overlap between two AABB boxes involves evaluating simple comparative inequalities across both the X and Y axes. If the absolute distance between the centers of two boxes along both axes is less than the sum of their respective half-dimensions, an intersection is confirmed. The collision resolution system then calculates the penetration depth—the smallest overlap distance—and pushes the dynamic entity outward along that axis to resolve the collision immediately.</p>

        let currentSpread = 0;
        const totalSpreads = pages.length / 2; // Exactly 80 spreads for 160 pages

        function countWords(html) {
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = html;
            const text = tempDiv.textContent || tempDiv.innerText || "";
            return text.trim().split(/\s+/).length;
        }

        function renderSpread() {
            const leftIdx = currentSpread * 2;
            const rightIdx = currentSpread * 2 + 1;

            const leftHtml = pages[leftIdx] || '';
            const rightHtml = pages[rightIdx] || '';

            document.getElementById('left-page').innerHTML = leftHtml + `<div class="word-count-debug">Page ${leftIdx + 1} Word Count: ~${countWords(leftHtml)} words</div>`;
            document.getElementById('right-page').innerHTML = rightHtml + `<div class="word-count-debug">Page ${rightIdx + 1} Word Count: ~${countWords(rightHtml)} words</div>`;

            document.getElementById('page-indicator').innerText = `Spread ${currentSpread + 1} of ${totalSpreads} (Pages ${leftIdx + 1} & ${rightIdx + 1})`;
            
            document.getElementById('prev-btn').disabled = currentSpread === 0;
            document.getElementById('next-btn').disabled = currentSpread >= totalSpreads - 1;

            document.getElementById('left-page').scrollTop = 0;
            document.getElementById('right-page').scrollTop = 0;
        }

        function changeSpread(direction) {
            currentSpread += direction;
            if (currentSpread < 0) currentSpread = 0;
            if (currentSpread >= totalSpreads) currentSpread = totalSpreads - 1;
            renderSpread();
        }

        renderSpread();
